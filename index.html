<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/3477e633a1.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>ChatGPT Bot</h3>
        </div>

        <div class="info">
            <a href="https://mg00310.github.io/haedal-web/" target="_blank">Made by MinGyu</a>

        </div>  

        <div class="chat-container">
            <div id="chat-log">
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Send a message.">
            <button id="send-button">
                <i class="fa-solid fa-paper-plane" id="button-icon"></i>
            </button>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/68919c29ca.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>



</html>
